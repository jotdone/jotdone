<style>

  h1{ font-size:34px; font-weight:700; letter-spacing:-.5px; }
  .sub{ color:var(--muted); font-size:18px; margin-top:12px; }
  .cards{ display:flex; gap:16px; flex-wrap:wrap; margin-top:40px; }
  .card{ flex:1; min-width:200px; background:var(--card); border-radius:16px; padding:24px; }
  .card a{ color:var(--accent); text-decoration:none; font-weight:600; font-size:17px; }
  .card p{ color:var(--muted); font-size:14px; margin-top:8px; }
  footer{ color:var(--muted); font-size:13px; margin-top:48px; }
  a.inline{ color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">

  <div class="cards">
    <div class="card">

</html>
